name: tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is 3.14 and 3.14 is the current release, so the
        # matrix is one entry (#46). It stays a matrix because the shape is
        # what a second version costs nothing to add back to -- and the
        # container leg below builds the same version from the Dockerfile,
        # deliberately, so this leg and that one cannot silently diverge.
        python-version: ["3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        # `python -m pytest`, not the `pytest` console script: the module form puts
        # the repo root on sys.path, and the package is not pip-installed here. The
        # script form fails at collection with ModuleNotFoundError.
        run: python -m pytest tests/ -v

  container:
    name: Container (as published)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run the suite in the image
        # The script, not an inlined docker command: it is what CLAUDE.md
        # documents for local use, and running anything else here is how the
        # documented command and the gating command drift apart (#27).
        run: scripts/test-container.sh

      - name: A bare build must still produce the runtime image
        # The test stage is deliberately not last, because the last stage is
        # what `docker build .` and deploy-docker.yml publish. Reordering the
        # stages would silently ship an image carrying pytest and the tests.
        run: |
          docker build -t tcpm:runtime .
          entrypoint=$(docker image inspect tcpm:runtime \
            --format '{{index .Config.Entrypoint 0}} {{index .Config.Entrypoint 1}}')
          echo "entrypoint: $entrypoint"
          test "$entrypoint" = "python run.py"
          # pytest present in the runtime image means the test stage leaked in.
          # Assert on the *message*, not on a non-zero exit: `! docker run ...`
          # would also pass if the image vanished or had no shell, so the guard
          # would rot into a no-op without anyone noticing.
          probe=$(docker run --rm --entrypoint sh tcpm:runtime \
            -c 'python -c "import pytest" 2>&1 || true')
          echo "probe: $probe"
          case "$probe" in
            *"No module named 'pytest'"*) ;;
            *) echo "runtime image can import pytest, or the probe broke"; exit 1 ;;
          esac

  javascript:
    name: JS (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: tests/js
        # ci, not install: the lockfile is committed, and this fails loudly if it
        # has drifted from package.json instead of quietly rewriting it.
        run: npm ci

      - name: Run node --test
        working-directory: tests/js
        run: node --test
